  /api/v1/recipes/{recipe_id}/revisions:
    get:
      operationId: listRevisions
      summary: List revision history or pending candidates
      tags:
      - Recipes
      description: Ordered created_at DESC,id DESC. is_candidate means extraction revision never accepted and not
        current; previously accepted revisions remain history, not candidates. Membership requires an acceptance
        record/history in the domain layer.
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: scope
        in: query
        schema:
          type: string
          enum:
          - all
          - candidates
          default: all
      responses:
        '200':
          description: List revision history or pending candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionsPage'
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
                description: Opaque, case-sensitive identifier; do not assume UUID formatting.
              description: Unique per HTTP request; contains no secrets.
            Cache-Control:
              schema:
                type: string
                const: no-store
