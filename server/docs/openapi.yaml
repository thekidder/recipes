              schema:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
                description: Opaque, case-sensitive identifier; do not assume UUID formatting.
              description: Unique per HTTP request; contains no secrets.
            Cache-Control:
              schema:
                type: string
                const: no-store
        '422':
          $ref: '#/components/responses/Error422'
    post:
      operationId: saveRevision
      summary: Save Markdown and atomically enqueue rendering
      tags:
      - Recipes
      description: Validate the same erecipe/v1 grammar used for extraction; title is derived from Markdown. Check
        expected_lock_version atomically, create immutable revision, increment lock, and enqueue render. Inherits
        source association. No LLM call or publication. Archived recipes return 409 recipe_archived. Requires an
        existing current revision; otherwise 409 revision_unavailable. Location identifies the new revision.
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Save Markdown and atomically enqueue rendering
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevisionSaved'
          headers:
            Location:
              description: Relative URL of the created or polled resource.
              schema:
                type: string
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
                description: Opaque, case-sensitive identifier; do not assume UUID formatting.
              description: Unique per HTTP request; contains no secrets.
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
