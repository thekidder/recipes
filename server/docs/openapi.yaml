components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: Per-client opaque token; hashed on server, stored in iOS Keychain. Shared-library access, no
        administration.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID, reused unchanged for retries. Keys are scoped to user across all application
        commands; target and operation are fingerprinted. Dashboard control keys use a separate server-wide durable
        namespace independent of Tailscale identity. See x-contract.idempotency.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
        minLength: 1
        maxLength: 4096
      description: 'Opaque cursor bound to endpoint, filters and page size; expires after 24 hours. Invalid/expired
        cursor: 400 invalid_cursor; restart traversal.'
    ControlHeader:
      name: X-eRecipe-Control
      in: header
      required: true
      description: Required on dashboard POST requests in addition to trusted Serve ingress and exact Origin validation.
        CSRF protection, not a credential.
      schema:
        type: string
        const: '1'
    DashboardOrigin:
      name: Origin
      in: header
      required: true
      description: Browser-supplied origin must exactly match the configured Tailscale Serve HTTPS origin, including
        any nondefault port.
      schema:
        type: string
        format: uri
  responses:
    Error400:
      description: Malformed JSON, cursor, multipart manifest or missing/invalid Idempotency-Key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          schema:
            $ref: '#/components/schemas/Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
    Error401:
      description: 'Missing, invalid, expired or revoked authentication. Bearer endpoints send WWW-Authenticate:
        Bearer.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        WWW-Authenticate:
          schema:
            type: string
          description: Bearer on application authentication failures; absent for enrollment-code rejection.
        X-Request-ID:
          schema:
            $ref: '#/components/schemas/Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
    Error403:
      description: Dashboard trusted-ingress, Host, Origin or CSRF boundary failed. Tailnet rules govern service
        reachability; no application administrator identity is required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          schema:
            $ref: '#/components/schemas/Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
    Error404:
      description: Resource not found, including an invalid cross-recipe relationship.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          schema:
            $ref: '#/components/schemas/Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
    Error409:
      description: Revision conflict, idempotency mismatch, archived recipe, or invalid state transition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          schema:
            $ref: '#/components/schemas/Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
    Error410:
      description: Enrollment expired, revoked, already redeemed or otherwise unusable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          schema:
            $ref: '#/components/schemas/Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
    Error413:
      description: Body, text, image count, file size or decoded pixel limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          schema:
            $ref: '#/components/schemas/Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
    Error415:
      description: Unsupported request content type or image encoding.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          schema:
            $ref: '#/components/schemas/Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
    Error422:
      description: Valid JSON but invalid fields, unsupported capability, unsafe URL or invalid Markdown.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          schema:
            $ref: '#/components/schemas/Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
    Error429:
      description: Rate limited. Retry-After contains integer seconds.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          schema:
            type: string
            pattern: ^[0-9]+$
          description: Seconds before retrying; required for 429, optional for 503.
        X-Request-ID:
          schema:
            $ref: '#/components/schemas/Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
    Error503:
      description: A required synchronous service is unavailable. Durable imports may still be accepted while workers
        are unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        Retry-After:
          schema:
            type: string
            pattern: ^[0-9]+$
          description: Seconds before retrying; required for 429, optional for 503.
        X-Request-ID:
          schema:
            $ref: '#/components/schemas/Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
    Error500:
      description: Unexpected server failure; no sensitive exception details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
      headers:
        X-Request-ID:
          schema:
            $ref: '#/components/schemas/Id'
        Cache-Control:
          schema:
            type: string
            const: no-store
  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 128
      pattern: ^[A-Za-z0-9_-]+$
      description: Opaque, case-sensitive identifier; do not assume UUID formatting.
    ErrorDetail:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
        details:
          type: object
          additionalProperties: true
      required:
      - code
      - message
      - retryable
      - details
      additionalProperties: true
      allOf:
      - if:
          properties:
            code:
              const: revision_conflict
          required:
          - code
        then:
          properties:
            details:
              type: object
              required:
              - current_revision_id
              - lock_version
              properties:
                current_revision_id:
                  anyOf:
                  - $ref: '#/components/schemas/Id'
                  - type: 'null'
                lock_version:
                  type: integer
                  minimum: 0
    Error:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Opaque, case-sensitive identifier; do not assume UUID formatting.
      required:
      - error
      - request_id
      additionalProperties: true
    User:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[A-Za-z0-9_-]+$
          description: Opaque, case-sensitive identifier; do not assume UUID formatting.
        display_name:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - id
      - display_name
      additionalProperties: true
    AdminUser:
      type: object
      properties:
        id:
          type: string
