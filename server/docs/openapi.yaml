  /api/v1/assets/{asset_id}:
    get:
      operationId: getAsset
      summary: Download an authenticated immutable asset
      tags:
      - Assets
      description: 'Validate bearer token before conditional-cache handling. Strong ETag is quoted full SHA-256.
        Matching If-None-Match (including wildcard/list/weak validator comparison for GET) returns 304 with no body.
        Cache-Control: private, max-age=31536000, immutable. No byte-range support promised; may return full 200.
        Only image/png and image/jpeg may be inline; all other content is attachment with a server-generated safe
        filename. Always nosniff; HTML additionally sandbox CSP. Do not load archived markup in an executable WebView.
        Clients partition cache by server_id and clear private content on disconnect.'
      parameters:
      - name: asset_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      - name: If-None-Match
        in: header
        schema:
          type: string
      responses:
        '200':
          description: Complete asset bytes.
          headers:
            ETag:
              schema:
                type: string
            Content-Length:
              schema:
                type: integer
                minimum: 0
            Cache-Control:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
                description: Opaque, case-sensitive identifier; do not assume UUID formatting.
              description: Unique per HTTP request; contains no secrets.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
