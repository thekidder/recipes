openapi: 3.1.0
info:
  title: eRecipe application and dashboard administration API
  version: 1.0.0
  description: Authoritative wire contract, October 13, 2026. Server implementation supports text and image imports;
    URL acquisition remains capability-gated and unavailable. Supersedes the seed API in PHASE2_HANDOFF.md for wire shapes; product invariants remain. Paths include
    prefixes; application origin is configured separately from the reader LAN origin. No OpenAI keys, firmware credentials,
    lease tokens, storage paths or token hashes appear in these DTOs.
servers:
- url: /
  description: Configured Tailscale Serve HTTPS origin for dashboard, /control/v1 and /api/v1; distinct from the
    firmware LAN origin.
security:
- BearerAuth: []
x-contract:
  status: server-implemented
  enrollment: 'erecipe://enroll?v=1&server=<percent-encoded HTTPS origin>&code=<43-char unpadded base64url secret>.
    Exactly these three query keys; reject duplicates, unknown versions, fragments, userinfo, invalid ports, and
    server paths/query/fragment. Scheme/host must be erecipe/enroll, path empty. App shows origin and confirms before
    exchange. Never send an existing bearer token during enrollment, never follow redemption redirects, validate
    TLS normally. Installed app and reachable Tailscale connection required. Expiry 600 seconds from server creation;
    redemption at/after expiry fails. Single-use is strict: no response replay. Lost post-commit response requires
    revoking linked credential and new QR. Token has no automatic expiry; revocable per credential or user. Hash
    only at rest, constant-time secret comparisons. Generic invalid code, rate-limit by source (20 redemption requests/minute)
    and globally (100/minute); Retry-After on 429. Enrollment codes appear only in the QR deep link and redemption
    JSON body; never in HTTP URL query strings, logs or analytics. Bearer tokens appear only in the one-time redemption
    response and Authorization headers. Custom schemes are not exclusive to one app; this design does not promise
    protection against another installed app claiming the scheme. Code hashes and redemption-to-credential status
    records remain available for audit/recovery after expiry; no raw code is retained. Keychain credentials must
    be shared with the Share extension through an explicitly configured Keychain access group if background uploads
    use them; do not put tokens in App Group files or ordinary preferences. The server origin embedded in QR codes
    is the configured Tailscale Serve HTTPS origin, never the loopback upstream address. Redemption rate-limit source
    is derived only from trusted Serve ingress metadata; never trust arbitrary forwarded source headers from the
    LAN listener.'
  idempotency: 'All commands marked with Idempotency-Key keep durable receipts for the lifetime of their target
    records; no automatic expiry in v1. Authenticate first, then look up receipt before state/conflict checks. Namespace
    is user ID for application commands; a single separate server-wide dashboard-control namespace, independent
    of optional Tailscale identity. Fingerprint HTTP method, canonical route/target and validated logical body;
    image fingerprint includes manifest order, filenames, detected MIME and byte hashes, excluding multipart boundaries/header
    order. Same key+fingerprint replays original status/body/Location even if resources progressed; mismatched request
    returns 409 idempotency_conflict. Replay header Idempotency-Replayed: true; false on first success. Commit receipt
    and domain transition atomically; never replay partial side effects. Only successful outcomes are retained;
    failures before commit do not reserve a key. Server job-internal keys occupy a separate namespace. Enrollment
    creation/redemption and self-revocation are explicit exceptions. Request-ID is per HTTP attempt, never replayed.'
  pagination: Default limit 50, maximum 100. items,next_cursor,has_more; next_cursor is null iff has_more=false.
    Default ordering created_at DESC,id DESC; capture and attempt/call routes state alternatives. First-page high-water
    bound retained in opaque cursor; bind route, target, filters and page size. Cursor expires in 24 hours; invalid
    or expired -> 400 invalid_cursor. No offset pagination, total count, snapshot isolation or incremental sync
    promise. Reconcile recipes using visibility=all, apply explicit archive records, retain absent records, then
    repeat traversal on later refresh. updated_at is not a sync cursor. Defaults and filters must remain identical
    when following next_cursor.
  concurrency: expected_lock_version required for editing, acceptance, archive. Compare atomically; 409 revision_conflict
    includes details.current_revision_id and details.lock_version (current server values). Increment only on current-document/archive
    transitions; job progress/candidates/renders update updated_at without changing lock_version. Client retains
    unsaved draft; do not silently rebase. First successful extraction can initialize current only if null; later
    extraction results are candidates. Candidate membership is never inferred simply as revision != current.
  limits: 'Application JSON body maximum 1 MiB including JSON encoding; decoded text/Markdown <=100000 Unicode scalars;
    URL <=8192 scalars. Non-whitespace text, nonblank single-line names. Reject content-encoded request bodies (415)
    in v1. Image capability: 6 still JPEG/PNG images, <=10 MiB/file, <=30 MiB summed files, multipart <=31
    MiB incl metadata/headers, metadata <=16 KiB, <=20 million decoded pixels per file. Signature must match declared
    type; animated PNG, HEIC, GIF, PDF and SVG unsupported (415 unsupported_media_type). Validate bounds before
    expensive decode; preserve originals before normalization. Capability advertised only when bounded validation/normalization
    exist. Values returned in status match these constants.'
  errors: Every non-2xx except 304 has Error envelope, including framework validation/404/405/500. Codes are extensible
    strings. Validation details.violations is an array of {path,message,line?}; JSON pointer path, optional one-based
    Markdown line. Never echo enrollment codes, input secrets or raw provider failures. retryable means retrying
    the same request/work may succeed after stated remediation; it is not permission to retry edits with a different
    lock or automatically replay enrollment. 401 bearer errors use invalid_credentials; all errors carry request_id
    also in X-Request-ID. Responses for unsupported HTTP methods use 405 method_not_allowed with Allow; unknown
    routes use 404 not_found.
  cache: 'All JSON/control/enrollment/error responses Cache-Control: no-store. Asset GET alone uses private immutable
    caching and ETag. Authenticate before 304; client caches are partitioned by server_id and credentials/access
    context, erased on disconnect. Firmware /images caching is unaffected.'
  compatibility: Clients ignore unknown response fields and tolerate unknown error codes. Required fields remain
    present; null is distinct from missing. Requests reject unknown fields. IDs are case-sensitive opaque strings;
    assets use full SHA-256. New enum values require client-safe handling before introduction. Breaking wire changes
    require /api/v2. Capability flags gate implementation availability, not user permissions. server_id is persistent
    across restart and stable for a library, separate from its hostname. Fields named *_href and Location are origin-relative
    paths beginning with /api/v1 or /control/v1 as applicable. Clients resolve them against the configured origin,
    not the firmware LAN origin, and must not attach a bearer token to a different origin.
  job_semantics: Jobs describe one stage. Parent success and creation of its child are atomic; results are inspectable.
    cancel traverses descendants under same transaction/fence, including a stage finishing concurrently. Completed
    evidence immutable. Background jobs cannot change explicit publication or overwrite accepted revisions. Attempt
    cap five; failed capture retries create new linked capture via refresh. All API state mutations and job completions
    must check archive state.
  error_codes:
  - invalid_request
  - invalid_cursor
  - invalid_credentials
  - enrollment_invalid
  - enrollment_unavailable
  - enrollment_origin_unconfigured
  - enrollment_already_redeemed
  - user_disabled
  - forbidden
  - not_found
  - idempotency_conflict
  - revision_conflict
  - revision_unavailable
  - candidate_not_pending
  - recipe_archived
  - capture_incomplete
  - refresh_unsupported
  - job_not_retryable
  - job_not_cancellable
  - device_not_paired
  - page_not_found
  - payload_too_large
  - unsupported_media_type
  - unsupported_import_kind
  - unsupported_profile
  - unsafe_url
  - unsupported_source
  - source_too_large
  - invalid_markdown
  - render_overflow
  - render_unavailable
  - configuration_missing
  - capture_failed
  - capture_cancelled
  - provider_refusal
  - provider_unavailable
  - invalid_extraction
  - rate_limited
  - service_unavailable
  - internal_error
  - method_not_allowed
  - unsupported_capability
  capability_failure: Operations whose x-required-capability flag is false return 422 unsupported_capability with
    details.capability before mutation. Import kinds not advertised return 422 unsupported_import_kind; unknown
    render profile returns 422 unsupported_profile. Read endpoints remain available for previously retained data
    regardless of feature availability.
  dashboard_access: 'The dashboard and /control/v1 are available at the configured Tailscale Serve HTTPS origin.
    Tailnet access rules are the authorization boundary: anyone permitted to reach this service through Serve is
    trusted to administer it. There is no application-level dashboard login, administrator allowlist, bearer token
    or required Tailscale user-identity header. Tagged source devices are permitted when tailnet access rules permit
    them. Serve terminates HTTPS and proxies to a dedicated loopback-bound application listener, separate from the
    LAN firmware listener. The local host is trusted. The LAN listener must reject /control/v1 regardless of claimed
    headers; clients cannot select trusted ingress by supplying a header. No public Funnel ingress. Existing direct-loopback
    legacy controls may retain their original local checks; legacy controls exposed through Serve use the same trusted
    ingress and browser protections as the dashboard. Both listeners must share coordinated library/device-store
    access, never independent writers. OpenAPI security: [] on controls means no application credential, not public
    network access.'
  dashboard_csrf: 'On Serve ingress require Host to match the configured HTTPS origin authority; validate any supplied
    Origin against that exact origin. All dashboard/control POST requests additionally require Origin equal to the
    configured HTTPS origin and X-eRecipe-Control: 1. Missing/mismatched Origin or control header -> 403 forbidden.
    No cross-origin CORS access to controls, no state-changing GET. Do not compare Origin to the internal HTTP upstream
    URL or derive trusted public origins from arbitrary Forwarded/X-Forwarded headers. Tailscale-User-Login may
    be recorded as optional audit context from trusted Serve ingress but is never required or used to allow/deny
    dashboard access. The /api/v1 bearer requirement remains unchanged, except for the intentionally unauthenticated
    enrollment exchange.'
paths:
  /api/v1/enrollments/redeem:
    post:
      operationId: redeemEnrollment
      summary: Consume a QR enrollment code and issue one client credential
      tags:
      - Enrollment
      description: 'No existing bearer token required. Atomic consume-and-create: one winner in concurrent redemption;
        code cannot be exchanged twice. Unknown well-formed code: 401 enrollment_invalid; expired/revoked/redeemed
        code: 410 enrollment_unavailable. Credential returned once, never replayed. If response is lost after commit,
        use dashboard to revoke the linked credential and create a new enrollment; do not automatically loop retries.
        Cache-Control: no-store. Location identifies /api/v1/status. Code/body/response excluded from logs.'
      parameters: []
      responses:
        '201':
          description: Consume a QR enrollment code and issue one client credential
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentRedeemed'
          headers:
            Location:
              description: Relative URL of the created or polled resource.
              schema:
                type: string
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
                description: Opaque, case-sensitive identifier; do not assume UUID formatting.
              description: Unique per HTTP request; contains no secrets.
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '410':
          $ref: '#/components/responses/Error410'
        '413':
          $ref: '#/components/responses/Error413'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        default:
          description: Other failures use the same envelope. Clients must tolerate unknown error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
                description: Opaque, case-sensitive identifier; do not assume UUID formatting.
              description: Unique per HTTP request; contains no secrets.
            Cache-Control:
              schema:
                type: string
                const: no-store
        '422':
          $ref: '#/components/responses/Error422'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedeemEnrollment'
  /api/v1/status:
    get:
      operationId: getStatus
      summary: Get current user, capabilities and readiness
      tags:
      - Status
      description: Get current user, capabilities and readiness
      parameters: []
      responses:
        '200':
          description: Get current user, capabilities and readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
                description: Opaque, case-sensitive identifier; do not assume UUID formatting.
              description: Unique per HTTP request; contains no secrets.
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        default:
          description: Other failures use the same envelope. Clients must tolerate unknown error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
                description: Opaque, case-sensitive identifier; do not assume UUID formatting.
              description: Unique per HTTP request; contains no secrets.
            Cache-Control:
              schema:
                type: string
                const: no-store
        '422':
          $ref: '#/components/responses/Error422'
  /api/v1/credentials/current/revoke:
    post:
      operationId: revokeCurrentCredential
      summary: Revoke the calling credential
      tags:
      - Credentials
      description: Used for disconnect/logout. Idempotent effect; after revocation the same token returns 401. Erasing
        local credentials alone does not revoke server access.
      parameters: []
      responses:
        '204':
          description: Revoke the calling credential
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
                description: Opaque, case-sensitive identifier; do not assume UUID formatting.
              description: Unique per HTTP request; contains no secrets.
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        default:
          description: Other failures use the same envelope. Clients must tolerate unknown error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
                description: Opaque, case-sensitive identifier; do not assume UUID formatting.
              description: Unique per HTTP request; contains no secrets.
            Cache-Control:
              schema:
                type: string
                const: no-store
        '422':
          $ref: '#/components/responses/Error422'
  /api/v1/imports:
    post:
      operationId: createImport
      summary: Persist original input and enqueue processing
      tags:
      - Imports
      description: '202 means original bytes and the initial durable job committed. Text starts extract; URL starts
        capture. Missing OpenAI configuration does not reject a supported import: preserve input, expose readiness,
        and let processing report configuration_missing. Unsupported capability returns 422 unsupported_import_kind
        before creating a recipe. Location points to the initial job. Does not publish.'
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Persist original input and enqueue processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportAccepted'
          headers:
            Location:
              description: Relative URL of the created or polled resource.
              schema:
                type: string
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
                description: Opaque, case-sensitive identifier; do not assume UUID formatting.
              description: Unique per HTTP request; contains no secrets.
            Idempotency-Replayed:
              schema:
                type: string
                enum:
                - 'true'
                - 'false'
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '409':
          $ref: '#/components/responses/Error409'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '422':
          $ref: '#/components/responses/Error422'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        '503':
          $ref: '#/components/responses/Error503'
        default:
          description: Other failures use the same envelope. Clients must tolerate unknown error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
                description: Opaque, case-sensitive identifier; do not assume UUID formatting.
              description: Unique per HTTP request; contains no secrets.
            Cache-Control:
              schema:
                type: string
                const: no-store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JsonImport'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ImageImport'
            encoding:
              metadata:
                contentType: application/json
              image_1:
                contentType: image/jpeg, image/png
              image_2:
                contentType: image/jpeg, image/png
              image_3:
                contentType: image/jpeg, image/png
              image_4:
                contentType: image/jpeg, image/png
              image_5:
                contentType: image/jpeg, image/png
              image_6:
                contentType: image/jpeg, image/png
  /api/v1/recipes:
    get:
      operationId: listRecipes
      summary: List the shared library
      tags:
      - Recipes
      description: Ordered by immutable (created_at DESC, id DESC), bounded by first-page high-water tuple. Rows
        reflect read-time values, not a historical snapshot. For cache reconciliation traverse visibility=all, apply
        explicit archived_at, and never delete solely because an item is absent. New recipes above the bound appear
        on the next traversal. See x-contract.pagination.
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: visibility
        in: query
        schema:
          type: string
          enum:
          - active
          - archived
          - all
          default: active
      responses:
        '200':
          description: List the shared library
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecipesPage'
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
                description: Opaque, case-sensitive identifier; do not assume UUID formatting.
              description: Unique per HTTP request; contains no secrets.
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
        default:
          description: Other failures use the same envelope. Clients must tolerate unknown error codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
                description: Opaque, case-sensitive identifier; do not assume UUID formatting.
              description: Unique per HTTP request; contains no secrets.
            Cache-Control:
              schema:
                type: string
                const: no-store
        '422':
          $ref: '#/components/responses/Error422'
  /api/v1/recipes/{recipe_id}:
    get:
      operationId: getRecipe
      summary: Get current document and processing summary
      tags:
      - Recipes
      description: Get current document and processing summary
      parameters:
      - name: recipe_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
      responses:
        '200':
          description: Get current document and processing summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipe'
          headers:
            X-Request-ID:
              schema:
                type: string
                minLength: 1
                maxLength: 128
                pattern: ^[A-Za-z0-9_-]+$
                description: Opaque, case-sensitive identifier; do not assume UUID formatting.
              description: Unique per HTTP request; contains no secrets.
            Cache-Control:
              schema:
                type: string
                const: no-store
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '404':
          $ref: '#/components/responses/Error404'
        '429':
